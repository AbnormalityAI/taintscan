rules:
  - id: sec-aws-access-key
    name: AWS access key ID
    category: secret
    severity: high
    keywords: [akia, asia]
    regex: '\b((?:AKIA|ASIA)[A-Z0-9]{16})\b'
    description: Access key ID. Pair with a secret key to be usable.
  - id: sec-github-token
    name: GitHub token
    category: secret
    severity: critical
    keywords: [ghp_, gho_, ghs_, ghu_, github_pat_]
    regex: '\b((?:gh[pousr]_[A-Za-z0-9]{36,})|(?:github_pat_[A-Za-z0-9_]{50,}))\b'
  - id: sec-slack-token
    name: Slack token
    category: secret
    severity: high
    keywords: [xox]
    regex: '\b(xox[abprs]-[A-Za-z0-9-]{20,})\b'
  - id: sec-private-key
    name: PEM private key block
    category: secret
    severity: critical
    keywords: [private key]
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
  - id: sec-jwt
    name: JSON Web Token
    category: secret
    severity: medium
    keywords: [eyj]
    regex: '\b(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})\b'
  - id: sec-generic-assignment
    name: High-entropy secret assignment
    category: secret
    severity: medium
    keywords: [secret, password, passwd, token, api_key, apikey]
    regex: '(?i)\b\w*(?:secret|password|passwd|token|api_?key)\w*\s*[:=]\s*["'']?([A-Za-z0-9+/_\-]{16,})["'']?'
    min_entropy: 3.5
    description: Entropy gate keeps placeholders like "changeme" or "xxxxxxxx" out.
